<div
  class="pd-product-card"
  [class.pd-product-card-details]="productDetails"
>
  <div class="pd-card-media">
    <img
      [src]="product?.image || 'assets/fontawesome/images/2.png'"
      [alt]="product?.name || 'Product'"
      class="pd-card-img"
      loading="lazy"
    />
  </div>
  <div class="pd-card-body">
    <span class="pd-card-cat">{{ product?.category || 'Collection' }}</span>
    <h5 class="pd-card-title">{{ product?.name }}</h5>
    <p
      class="pd-card-desc"
      appPipe
      [product]="product"
      [trunc]="productDetails ? 350 : 72"
    ></p>

    <div class="pd-card-footer">
      <div class="pd-card-price">
        <span class="pd-price-num">{{ product?.price }}</span>
        <span class="pd-price-cur">USD</span>
      </div>
      <div class="pd-card-actions">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
