<div class="pd-panel pd-filter-panel">
  <h4 class="pd-panel-title">Category</h4>
  <div class="pd-chip-group">
    @for (cat of visibleCategories; track cat.value) {
      <button
        type="button"
        class="pd-chip"
        [class.active]="filter === cat.value"
        (click)="selectCategory(cat.value)"
      >
        {{ cat.label }}
      </button>
    }
  </div>
  @if (categories.length > 7) {
    <button
      type="button"
      class="pd-more-cats"
      (click)="showAllCategories = !showAllCategories"
    >
      {{ showAllCategories ? 'Show fewer' : '+ More categories' }}
    </button>
  }
</div>
