<div class="pd-panel pd-sort-panel">
  <h4 class="pd-panel-title">Sort by</h4>

  <label class="pd-radio-option" for="sort-name-asc">
    <input
      type="radio"
      name="sort"
      id="sort-name-asc"
      value="name"
      [(ngModel)]="sort"
      (change)="sorting()"
    />
    <span>Name (A-Z)</span>
  </label>

  <label class="pd-radio-option" for="sort-name-desc">
    <input
      type="radio"
      name="sort"
      id="sort-name-desc"
      value="-name"
      [(ngModel)]="sort"
      (change)="sorting()"
    />
    <span>Name (Z-A)</span>
  </label>

  <label class="pd-radio-option" for="sort-price-asc">
    <input
      type="radio"
      name="sort"
      id="sort-price-asc"
      value="price"
      [(ngModel)]="sort"
      (change)="sorting()"
    />
    <span>Price (low to high)</span>
  </label>

  <label class="pd-radio-option" for="sort-price-desc">
    <input
      type="radio"
      name="sort"
      id="sort-price-desc"
      value="-price"
      [(ngModel)]="sort"
      (change)="sorting()"
    />
    <span>Price (high to low)</span>
  </label>
</div>
