<div class='p-4 shadow border border-1 border-primary rounded-3 mt-5' style="background-color: rgb(207, 231, 252);">
  <h4 class="text-center text-primary mb-4">Sort by Name and Price</h4>
  <div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="sort" id="name" value="name" (change)="sorting()" [(ngModel)]="sort">
    <label class="form-check-label" for="name">
      Name (A-Z)    </label>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="sort" id="-name" value="-name" (change)="sorting()" [(ngModel)]="sort">
    <label class="form-check-label" for="-name">
      Name (Z-A)    </label>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="sort" id="price" value="price" (change)="sorting()" [(ngModel)]="sort">
    <label class="form-check-label" for="price">
      Price (low to high) </label>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="sort" id="-price" value="-price" (change)="sorting()" [(ngModel)]="sort">
    <label class="form-check-label" for="-price">
      Price (high to low) </label>
  </div>
</div>
