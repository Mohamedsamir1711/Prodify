<div class="page-wrapper">
  <app-navbar></app-navbar>
  <div class="container">
    <app-search-bar></app-search-bar>

    <h1 class="text-center text-primary animate__animated animate__heartBeat p-5">
      Welcome to Prodify
    </h1>


    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
          aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
          aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
          aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img class="d-block w-100" src="assets/fontawesome/images/1.png" alt="First slide" />

        </div>
        <div class="carousel-item">
          <img class="d-block w-100" src="assets/fontawesome/images/2.png" alt="Second slide" />

        </div>
        <div class="carousel-item">
          <img class="d-block w-100" src="assets/fontawesome/images/3.png" alt="Third slide" />

        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
  <div class="container d-flex justify-content-center gap-3 p-5">
    <a class="fw-bold nav-sty btn btn-primary p-2" routerLinkActive="fw-bold" routerLink="auth/login">Log In</a>
    <a class="fw-bold nav-sty btn btn-primary p-2" routerLinkActive="fw-bold" routerLink="auth/signup">Sign Up</a>
  </div>
  <app-footer class="mt-auto"></app-footer>
</div>
