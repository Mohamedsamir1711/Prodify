<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <!-- Hero Section -->
      <section class="pd-hero">
        <span class="pd-eyebrow">ENJOY THE EVERYDAY</span>
        <h1 class="pd-display pd-hero-title">
          Considered goods,<br />
          beautifully simple.
        </h1>
        <div class="pd-hero-cta">
          <a routerLink="/products" class="pd-btn pd-btn-dark">
            Browse products
          </a>
        </div>
      </section>

      <!-- Featured Deals Carousel -->
      <app-featured-deals></app-featured-deals>

      <!-- Catalog Section -->
      <section class="pd-catalog-grid">
        <aside class="pd-sidebar-col">
          <app-filter (filterEvent)="filtering($event)"></app-filter>
          <app-sort (sortEvent)="sorting($event)"></app-sort>
        </aside>

        <div class="pd-products-col">
          <div class="pd-items-meta">
            <span>{{ total || products.length }} items</span>
          </div>

          <div class="pd-cards-grid">
            @for (p of products; track p._id) {
              <app-card [product]="p">
                <a
                  [routerLink]="['/products', p._id]"
                  class="pd-btn pd-btn-ghost pd-btn-sm"
                >
                  Show more
                </a>
              </app-card>
            } @empty {
              <div class="pd-empty-box">
                <p>No products match the selected filter.</p>
              </div>
            }
          </div>
        </div>
      </section>
    </div>
  </main>

  <app-footer></app-footer>
</div>
