<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <div class="pd-page-head">
        <span class="pd-eyebrow">ADMINISTRATION</span>
        <h1 class="pd-display">Store Overview</h1>
      </div>

      <div class="pd-stats-grid">
        @for (s of stats; track s.label) {
          <div class="pd-panel pd-stat-card">
            <span class="pd-stat-label">{{ s.label }}</span>
            <div class="pd-stat-value pd-serif">{{ s.value }}</div>
            <span class="pd-stat-badge">{{ s.change }}</span>
          </div>
        }
      </div>

      <div class="pd-dash-actions pd-panel mt-4">
        <h3 class="pd-panel-title">Quick Actions</h3>
        <div class="pd-action-links">
          <a routerLink="/products/new" class="pd-btn pd-btn-dark">
            <i class="fas fa-plus"></i>
            <span>Add New Product</span>
          </a>
          <a routerLink="/products" class="pd-btn pd-btn-ghost">
            <span>Manage Products</span>
          </a>
          <a routerLink="/orders" class="pd-btn pd-btn-ghost">
            <span>View Orders</span>
          </a>
          <a routerLink="/settings" class="pd-btn pd-btn-ghost">
            <span>Account Settings</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
