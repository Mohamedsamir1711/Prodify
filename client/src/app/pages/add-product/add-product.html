<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <div class="pd-page-head">
        <span class="pd-eyebrow">CATALOG MANAGEMENT</span>
        <h1 class="pd-display">Add Product</h1>
      </div>

      <div class="pd-editor-card pd-panel">
        <form #addProduct="ngForm" (ngSubmit)="onSubmit(addProduct)">
          <div class="pd-field">
            <label for="name" class="pd-label">Product Name *</label>
            <input
              type="text"
              class="pd-input"
              [class.is-invalid]="(name.errors && name.touched) || name.dirty"
              id="name"
              name="name"
              #name="ngModel"
              [(ngModel)]="formData.name"
              placeholder="e.g. Hardcover Bullet Journal"
              required
            />
            @if ((name.errors && name.touched) || name.dirty) {
              @if (name.errors?.['required']) {
                <small class="pd-error">Name is required.</small>
              }
            }
          </div>

          <div class="pd-form-grid-3">
            <div class="pd-field">
              <label for="price" class="pd-label">Price (USD) *</label>
              <input
                type="number"
                class="pd-input"
                [class.is-invalid]="(price.errors && price.touched) || price.dirty"
                id="price"
                name="price"
                #price="ngModel"
                [(ngModel)]="formData.price"
                required
                min="1"
              />
            </div>

            <div class="pd-field">
              <label for="category" class="pd-label">Category *</label>
              <select
                class="pd-input"
                [class.is-invalid]="
                  (category.errors && category.touched) || category.dirty
                "
                id="category"
                name="category"
                #category="ngModel"
                [(ngModel)]="formData.category"
                required
              >
                <option value="">Select category</option>
                <option value="Stationery">Stationery</option>
                <option value="Fitness">Fitness</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Wearables">Wearables</option>
                <option value="Accessories">Accessories</option>
                <option value="Mobile">Mobile</option>
                <option value="Audio">Audio</option>
                <option value="Furniture">Furniture</option>
                <option value="Home">Home</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Photography">Photography</option>
                <option value="Outdoors">Outdoors</option>
              </select>
            </div>

            <div class="pd-field">
              <label for="quantity" class="pd-label">Stock Quantity *</label>
              <input
                type="number"
                class="pd-input"
                id="quantity"
                name="quantity"
                #quantity="ngModel"
                [(ngModel)]="formData.quantity"
                required
              />
            </div>
          </div>

          <div class="pd-field">
            <label for="image" class="pd-label">Image URL *</label>
            <input
              type="text"
              class="pd-input"
              id="image"
              name="image"
              #image="ngModel"
              [(ngModel)]="formData.image"
              placeholder="https://images.unsplash.com/..."
              required
            />
          </div>

          <div class="pd-field">
            <label for="description" class="pd-label">Description *</label>
            <textarea
              rows="4"
              class="pd-input"
              id="description"
              name="description"
              #description="ngModel"
              [(ngModel)]="formData.description"
              placeholder="Describe the materials, craftsmanship, and everyday utility..."
              required
            ></textarea>
          </div>

          <div class="pd-editor-actions">
            <a routerLink="/products" class="pd-btn pd-btn-ghost">
              Cancel
            </a>
            <button
              type="submit"
              class="pd-btn pd-btn-dark"
              [disabled]="addProduct.invalid"
            >
              Publish Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
