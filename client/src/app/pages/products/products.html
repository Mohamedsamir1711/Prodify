<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <!-- Page Header -->
      <div class="pd-page-head">
        <span class="pd-eyebrow">THE COLLECTION</span>
        <h1 class="pd-display">Products</h1>
      </div>

      <!-- Search Pill -->
      <div class="pd-products-search">
        <app-search-bar (searchEvent)="searching($event)"></app-search-bar>
      </div>

      <!-- Featured Deals Section -->
      <app-featured-deals></app-featured-deals>

      <!-- Sidebar + Grid -->
      <section class="pd-catalog-grid">
        <aside class="pd-sidebar-col">
          <app-filter (filterEvent)="filtering($event)"></app-filter>
          <app-sort (sortEvent)="sorting($event)"></app-sort>
        </aside>

        <div class="pd-products-col">
          <div class="pd-items-meta">
            <span>{{ total || product.length }} items</span>
            <a routerLink="/products/new" class="pd-add-link">
              + Add product
            </a>
          </div>

          <div class="pd-cards-grid">
            @for (p of product; track p._id) {
              <app-card [product]="p">
                <a
                  [routerLink]="['/products', p._id]"
                  class="pd-btn pd-btn-ghost pd-btn-sm"
                >
                  Show more
                </a>
              </app-card>
            } @empty {
              <div class="pd-empty-box">
                <h3>No products found</h3>
                <p>Try adjusting your search query or category filter.</p>
              </div>
            }
          </div>

          <div class="pd-pagination-wrap">
            <app-pagination
              [total]="total"
              (paginationEvent)="pagination($event)"
            ></app-pagination>
          </div>
        </div>
      </section>
    </div>
  </main>

  <app-footer></app-footer>
</div>
