<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <div class="pd-page-head">
        <span class="pd-eyebrow">PURCHASE HISTORY</span>
        <h1 class="pd-display">Orders</h1>
      </div>

      <div class="pd-panel pd-orders-card">
        @for (o of orders; track o.orderNumber) {
          <div class="pd-order-row">
            <div>
              <div class="pd-order-num">{{ o.orderNumber }}</div>
              <div class="pd-muted small">
                {{ o.date | slice : 0 : 10 }} · {{ o.customer || 'Asher Brown' }}
              </div>
            </div>
            <div class="pd-muted small">{{ o.itemsCount }} item(s)</div>
            <span class="pd-badge-status">{{ o.status }}</span>
            <div class="pd-order-amt">{{ o.total }} USD</div>
          </div>
        }
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
