<div class="pd-page">
  <app-navbar></app-navbar>

  <main class="pd-main">
    <div class="pd-container">
      <div class="pd-page-head">
        <span class="pd-eyebrow">CATALOG MANAGEMENT</span>
        <h1 class="pd-display">Update Product</h1>
      </div>

      <div class="pd-editor-card pd-panel">
        <form [formGroup]="updateProduct" (submit)="onSubmit()">
          <div class="pd-field">
            <label for="name" class="pd-label">Product Name</label>
            <input
              type="text"
              class="pd-input"
              id="name"
              formControlName="name"
              [class.is-invalid]="checkInput('name')"
            />
            @if (checkInput('name')) {
              <small class="pd-error">Name must be at least 3 characters.</small>
            }
          </div>

          <div class="pd-form-grid-2">
            <div class="pd-field">
              <label for="price" class="pd-label">Price (USD)</label>
              <input
                type="number"
                class="pd-input"
                id="price"
                formControlName="price"
                [class.is-invalid]="checkInput('price')"
              />
            </div>

            <div class="pd-field">
              <label for="category" class="pd-label">Category</label>
              <select
                class="pd-input"
                [class.is-invalid]="checkInput('category')"
                id="category"
                formControlName="category"
              >
                <option value="">Select a category</option>
                <option value="Stationery">Stationery</option>
                <option value="Fitness">Fitness</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Wearables">Wearables</option>
                <option value="Accessories">Accessories</option>
                <option value="Mobile">Mobile</option>
                <option value="Audio">Audio</option>
                <option value="Furniture">Furniture</option>
                <option value="Home">Home</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Photography">Photography</option>
                <option value="Outdoors">Outdoors</option>
              </select>
            </div>
          </div>

          <div class="pd-field">
            <label for="image" class="pd-label">Image URL</label>
            <input
              type="text"
              class="pd-input"
              id="image"
              formControlName="image"
              [class.is-invalid]="checkInput('image')"
            />
          </div>

          <div class="pd-field">
            <label for="description" class="pd-label">Description</label>
            <textarea
              rows="4"
              class="pd-input"
              id="description"
              formControlName="description"
              [class.is-invalid]="checkInput('description')"
            ></textarea>
          </div>

          <div class="pd-editor-actions">
            <a routerLink="/products" class="pd-btn pd-btn-ghost">
              Cancel
            </a>
            <button
              type="submit"
              class="pd-btn pd-btn-dark"
              [disabled]="updateProduct.invalid"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
